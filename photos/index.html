<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobbs-Polito Wedding: Photos</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Croissant+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="../main.css">
</head>

<body class="gallery" data-root="../">
    <div class="nav-container">
        <nav class="navbar">
            <a href="../index.html" class="nav-tab">Home</a>
            <a href="../our-story/" class="nav-tab">Our Story</a>
            <a href="../faq/" class="nav-tab">FAQ</a>
            <a href="../photos/" class="nav-tab">Photos</a>
            <a href="../registry/" class="nav-tab">Registry</a>
            <a href="../rsvp/" class="nav-tab">RSVP</a>
            <a href="../travel/" class="nav-tab">Travel</a>
            <a href="../wedding-party/" class="nav-tab">Wedding Party</a>
        </nav>
    </div>

    <div class="photo-page-wrapper">
        <div class="story-intro">
            <h1 class="header" style="font-size: 3.5rem;">Our Memories</h1>
            <p>A few of our favorite snapshots over the years.</p>
        </div>
        <div id="scrapbook-gallery"></div>
    </div>

    <div id="photo-detail-view" style="display: none;">
        <div class="back-btn" onclick="closePhoto()">
            <i class="material-icons">arrow_back</i> Back to Photos
        </div>
        <div class="detail-card">
            <div class="detail-layout">
                <div class="detail-photo">
                    <img id="photo-detail-img" src="" alt="">
                </div>
                <div class="detail-info">
                    <h2 class="photo-caption-title" id="photo-detail-caption"></h2>
                    <p class="photo-caption-date" id="photo-detail-date"></p>
                    <div class="scrapbook-nav-wrapper">
                        <div class="nav-item prev" onclick="prevPhoto()">
                            <i class="material-icons">west</i> <span>PREV</span>
                        </div>
                        <div class="nav-item next" onclick="nextPhoto()">
                            <span>NEXT</span> <i class="material-icons">east</i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../scripts/gallery-logic.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/nav.js" defer></script>
</body>
</html>
