<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polito-Dobbs Wedding: Wedding Party</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="../main.css">
</head>

<body class="wedding-party" data-root="../">
    <div class="floral-corner floral-corner--tl"></div>
    <div class="floral-corner floral-corner--tr"></div>

    <div class="header"><a href="../index.html">Jess & Ben</a></div>
    <img src="../images/assets/floral-garland.svg" class="header-garland-bar" alt="">
    <div class="nav-container">
        <div class="nav-inner">
            <nav class="navbar">
                <a href="../index.html" class="nav-tab">Home</a>
                <a href="../our-story/" class="nav-tab">Our Story</a>
                <a href="../wedding-party/" class="nav-tab">Wedding Party</a>
                <a href="../registry/" class="nav-tab">Registry</a>
                <a href="../travel/" class="nav-tab">Travel</a>
                <a href="../faq/" class="nav-tab">FAQ</a>
                <a href="../rsvp/" class="nav-tab">RSVP</a>
            </nav>
            <img src="../images/assets/floral-garland.svg" class="floral-garland-bar" alt="">
        </div>
    </div>

    <main class="page-content">
        <div id="party-directory" class="scrapbook-grid"></div>

        <div id="party-detail-view" class="detail-container" style="display: none;">
            <div class="back-btn" onclick="closeDetail()">
                <i class="material-icons">arrow_back</i> Back to Directory
            </div>
            <div class="detail-card">
                <div class="detail-layout">
                    <div class="detail-photo">
                        <img id="detail-img" src="" alt="Profile">
                    </div>
                    <div class="detail-info">
                        <p id="detail-subtitle" class="line-1"></p>
                        <h2 id="detail-name" class="header-detail"></h2>
                        <div id="detail-flavor" class="flavor-text"></div>
                        <div class="scrapbook-nav-wrapper">
                            <div class="nav-item prev" onclick="prevPerson()">
                                <i class="material-icons">west</i> <span>PREV</span>
                            </div>
                            <div class="nav-item next" onclick="nextPerson()">
                                <span>NEXT</span> <i class="material-icons">east</i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../scripts/wedding-party-logic.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/nav.js" defer></script>
</body>
</html>
