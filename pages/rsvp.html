<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Event Celebration</title>
    <link rel="stylesheet" href="../main.css">
</head>

<body class="rsvp">
    <div class="nav-container">
        <nav class="navbar">
            <a href="../index.html" class="nav-tab">Home</a>
            <a href="../pages/our-story.html" class="nav-tab">Our Story</a>
            <a href="../pages/photos.html" class="nav-tab">Photos</a>
            <a href="../pages/registry.html" class="nav-tab">Registry</a>
            <a href="../pages/rsvp.html" class="nav-tab">RSVP</a>
            <a href="../pages/travel.html" class="nav-tab">Travel</a>
            <a href="../pages/wedding-party.html" class="nav-tab">Wedding Party</a>
        </nav>
    </div>
    <div class="rsvp-card">
        <h1>Confirm Your Attendance</h1>
        <p>Please let us know if you can make it by filling out the details below.</p>

        <form action="https://formspree.io/f/xeeokded" method="POST" id="rsvp-form">
            <div class="form-group">
                <label for="full-name-1">Full Name</label>
                <input type="text" id="full-name-1" name="name-1" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="email@example.com">
            </div>

            <div class="form-group">
                <label for="attendance">Will you be attending?</label>
                <select id="attendance" name="attendance-1" class="attendance-check" required>
                    <option value="" disabled selected>Choose an option</option>
                    <option value="yes">Yes, I'll be there!</option>
                    <option value="no">Sadly, I can't make it</option>
                </select>
            </div>
            <div id="food-questions" style="display: none;">
                <div class="form-group">
                    <label for="Entree Options">Select your entree</label>
                    <select id="entree-choice" name="entree-choice" required>
                        <option value="" disabled selected>Choose an option</option>
                        <option value="Beef">Steak</option>
                        <option value="Chicken">Chicken</option>
                        <option value="Vegetarian">Vegetarian</option>
                    </select>
                </div>
            </div>

            <div id="additional-guests-container"></div>
            <button type="button" id="add-guest-btn">+ Add Another Guest</button>
            <hr>
            <div class="form-group">
                <label for="message">Message for the Host (Optional)</label>
                <textarea id="message" name="message" rows="3" placeholder="Dietary requirements, etc."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit RSVP</button>
        </form>

        <a href="../index.html" class="back-link">← Back to Home</a>
    </div>
    <script src="../scripts/rsvp-logic.js"></script>
    <script src="../scripts/guest-iterator.js"></script>
</body>

</html>
