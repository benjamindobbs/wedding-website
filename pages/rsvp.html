<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Event Celebration</title>
    <link rel="stylesheet" href="../main.css">
</head>

<body class="rsvp">
    
    <div class="nav-container">
        <nav class="navbar">
            <a href="../index.html" class="nav-tab">Home</a>
            <a href="../pages/our-story.html" class="nav-tab">Our Story</a>
            <a href="../pages/photos.html" class="nav-tab">Photos</a>
            <a href="../pages/registry.html" class="nav-tab">Registry</a>
            <a href="../pages/rsvp.html" class="nav-tab">RSVP</a>
            <a href="../pages/travel.html" class="nav-tab">Travel</a>
            <a href="../pages/wedding-party.html" class="nav-tab">Wedding Party</a>
        </nav>
    </div>
    <div class="rsvp-box">
        <div id="code-entry-section">
            <h3>Enter Your Group Code</h3>
            <div class="form-group">
                <input type="text" id="group-code-input" maxlength="4" placeholder="e.g. DOE1"
                    style="text-transform: uppercase;">
                <button type="button" id="verify-code-btn">Next</button>
                <p id="code-error" style="color: red; display: none;">Invalid code. Please try again.</p>
            </div>
        </div>
        <form action="https://formspree.io/f/xeeokded" method="POST" id="rsvp-form" style="display: none;">
            <div class="form-container">
                <div class="form-group">
                    <label for="full-name-1">Primary Guest Name</label>
                    <select id="full-name-1" name="name-1" required>
                        <option value="" disabled selected>-- Select Your Name --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Will you attend?</label>
                    <select name="attendance-1" class="attendance-check" required>
                        <option value="" disabled selected>Choose an option</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="food-section" style="display: none;">
                    <label>Entree Choice</label>
                    <select name="entree-1">
                        <option value="Beef">Steak</option>
                        <option value="Chicken">Chicken</option>
                    </select>
                </div>
            </div>

            <div id="additional-guests-container"></div>
            <button type="button" id="add-guest-btn">+ Add Another Guest</button>
            <button type="submit">Submit RSVP</button>
        </form>
    </div>
    <script src="../scripts/rsvp-logic.js"></script>
    <script src="../scripts/guest-iterator.js"></script>
</body>

</html>
