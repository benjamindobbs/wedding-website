<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobbs-Polito Wedding: Home</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Croissant+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body data-root="./">
    <div id="password-overlay">
        <div class="password-box">
            <h2>Welcome to the Dobbs Wedding</h2>
            <p>Please enter the guest password found on your invitation to continue:</p>
            <div class="password-wrapper">
                <input type="password" id="site-password-input" placeholder="Enter Password">
                <i id="toggle-password" class="material-icons toggle-icon">visibility</i>
            </div>
            <button class="btn-primary" onclick="checkPassword()">Enter</button>
            <p id="password-error" style="color: red; display: none; margin-top: 15px;">Incorrect password. Please try again.</p>
        </div>
    </div>

    <div id="main-site-content" style="display: none;">
        <div class="page-wrapper">
            <div class="header">Jess & Ben</div>
            <div class="date-location">August 15, 2026</div>

            <div class="countdown-container">
                <div id="countdown">
                    <div class="time-box">
                        <span id="days"></span>
                        <span>Days to Go</span>
                    </div>
                </div>
            </div>

            <div class="nav-container">
                <nav class="navbar">
                    <a href="index.html" class="nav-tab">Home</a>
                    <a href="./our-story/" class="nav-tab">Our Story</a>
                    <a href="./faq/" class="nav-tab">FAQ</a>
                    <a href="./photos/" class="nav-tab">Photos</a>
                    <a href="./registry/" class="nav-tab">Registry</a>
                    <a href="./rsvp/" class="nav-tab">RSVP</a>
                    <a href="./travel/" class="nav-tab">Travel</a>
                    <a href="./wedding-party/" class="nav-tab">Wedding Party</a>
                </nav>
            </div>

            <div id="critical-info-banner">
                <div class="info-section" id="ceremony-info"></div>
                <div class="info-divider"></div>
                <div class="info-section" id="reception-info"></div>
            </div>

            <div class="landing-photo"></div>
        </div>
    </div>

    <script src="scripts/auth.js" defer></script>
    <script src="./scripts/countdown.js"></script>
    <script src="./scripts/event-info.js"></script>
    <script src="./scripts/nav.js" defer></script>
</body>
</html>
